<g opacity=".18" fill="#f5f5f7"><rect x="130" y="610" width="820" height="8" rx="4"/><rect x="210" y="650" width="28" height="260" rx="8"/><rect x="842" y="650" width="28" height="260" rx="8"/><rect x="180" y="820" width="210" height="34" rx="17"/><rect x="690" y="820" width="210" height="34" rx="17"/></g>
