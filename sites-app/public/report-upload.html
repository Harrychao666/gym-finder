<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>练哪儿｜体验官报告上传</title>
    <link rel="stylesheet" href="./report-upload.css?v=8" />
  </head>
  <body>
    <main class="upload-shell">
      <header>
        <span class="brand">练</span>
        <div><p>练哪儿体验官</p><h1>提交测评报告</h1></div>
      </header>
      <section class="upload-card">
        <p class="notice">请上传《体验官 7 天测评表 V1.1》：提交后系统会自动建立场馆草稿档案、提取事实并计算六模块评分。平台管理员随后会为该档案分配审核员；审核通过前不会公开。</p>
        <form id="reportForm">
          <label>体验官姓名或编号<input id="evaluatorName" required autocomplete="name" placeholder="例如：TYG-001" /></label>
          <label>体验场馆名称<input id="venueName" required placeholder="请填写门店完整名称，例如：星湾健身天河店" /><span class="field-help">请包含分店名称，系统将以此自动建立新的场馆草稿档案。</span></label>
          <label>所在区域<input id="venueDistrict" placeholder="例如：天河区（可稍后由审核员补充）" /></label>
          <label class="file-field">最新版体验官报告（DOCX 或 TXT）<input id="reportFile" type="file" accept=".docx,.txt,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain" required /><span id="fileHint">选择填写完成的 V1.1 报告</span></label>
          <button id="submitButton" type="submit">上传并自动建档</button>
        </form>
        <div id="result" class="result" hidden aria-live="polite"></div>
      </section>
    </main>
    <script src="./report-upload.js?v=8" defer></script>
  </body>
</html>
